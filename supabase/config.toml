# Local-only development. Do not link this project to a hosted database.
project_id = "testero-v2"
[api]
enabled = true
port = 56541
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 56542
shadow_port = 56540
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 56543
api_url = "http://127.0.0.1"
[inbucket]
enabled = true
port = 56544
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://127.0.0.1:3100/**"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[auth.email.template.confirmation]
subject = "Confirm your Testero account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your Testero password"
content_path = "./supabase/templates/recovery.html"
[analytics]
enabled = false
[edge_runtime]
enabled = false
